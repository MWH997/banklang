# GnuCOBOL dialect configuration for the BankLang target.
#
# Local validation used to run `cobc` in its default dialect, which is a
# superset of everything and a model of nothing. Under it a 31-character data
# name compiled, `ROUNDED MODE IS NEAREST-EVEN` compiled, and the gate was green
# on two constructs IBM Enterprise COBOL for z/OS 6.4 rejects outright. A
# validator weaker than the target is not a validator.
#
# This file starts from GnuCOBOL's own `ibm-strict.conf` and moves only where
# 6.4 genuinely differs from the level that file models. Every departure below
# carries the manual and page it comes from, because the point of the exercise
# is that a rule nobody can trace to IBM is a rule someone invented.
#
# Manuals, as extracted in `vendor-docs/`:
#   LR  Enterprise COBOL for z/OS 6.4 Language Reference
#   PG  Enterprise COBOL for z/OS 6.4 Programming Guide
#
# Usage:
#   cobc -std=default -conf=tools/banklang-ibm.conf -fixed ...
#
# `tools/gnucobol-validation.ts` runs every example under this configuration and
# under the default dialect, and treats a difference between them as a finding
# to explain rather than as noise to silence.

include "ibm-strict.conf"

name: "IBM Enterprise COBOL for z/OS 6.4 (BankLang profile)"

# --------------------------------------------------------------------------
# Kept from ibm-strict, restated because the conformance linter asserts the
# same three numbers and the two must not drift apart.
# --------------------------------------------------------------------------

# LR, "COBOL word": "a character string of not more than 30 characters that
# forms a user-defined word". This is the limit that `ROUNDED MODE IS` hid
# behind: `IS-ELIGIBLE-FOR-INTEREST-RESULT` is 31.
word-length:			30

# LR, "Alphanumeric literals": the maximum length is 160 characters.
literal-length:			160

# LR, "PICTURE clause": the character-string may contain a maximum of 50
# characters.
pic-length:			50

# --------------------------------------------------------------------------
# Departures from ibm-strict.
# --------------------------------------------------------------------------

# ibm-strict allows 31-digit numeric literals, with its own comment saying that
# is "for ARITH(EXTENDED), otherwise 18". BankLang compiles under ARITH(COMPAT)
# and says so in the `CBL` statement it emits, and its own numeric pictures are
# bounded at 18 digits, so the validator is held to the same 18.
#
# PG, "ARITH": under COMPAT "the maximum number of digits for an arithmetic
# operand is 18".
numeric-literal-length:		18

# ibm-strict models the OS/VS COBOL intermediate-result rules, where an
# intermediate is truncated at each step. Enterprise COBOL does not: PG,
# "Appendix A. Intermediate results" gives the number of integer and decimal
# places carried through a fixed-point expression, and it is not the OS/VS
# algorithm.
#
# This one is not cosmetic. The generated rounding sequences take the excess
# that truncation discarded as `expression - truncated`, evaluated in COBOL's
# own intermediate; under the OS/VS rules that subtraction can lose the digit
# the tie test is about, and `tests/rounding-oracle.test.ts` would be proving
# the wrong arithmetic.
arithmetic-osvs:		no

# TRUNC(STD) is Enterprise COBOL's default, and it is what BankLang states in
# the `CBL` statement it emits: a binary receiver is truncated to the number of
# digits in its PICTURE. ibm-strict turns this off, which models TRUNC(OPT) —
# and TRUNC changes results, not just code size, so the validator must not be
# modelling a different setting from the one the generated program asks for.
#
# PG, "TRUNC": "TRUNC(STD) ... the value is truncated to the number of digits
# specified in the PICTURE clause".
binary-truncate:		yes
