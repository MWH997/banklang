name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm@11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      # tests/cobol-compiles.test.ts skips without cobc. Installing GnuCOBOL
      # keeps that lane running in CI, so generated COBOL that no compiler
      # accepts cannot merge.
      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnucobol
          cobc --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Verify every example
        run: |
          for example in examples/*/; do
            echo "::group::bankc test $example"
            pnpm bankc test "$example"
            echo "::endgroup::"
          done
