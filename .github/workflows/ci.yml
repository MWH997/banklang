name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master
  # `release.yml` runs this whole file before it publishes anything, so a
  # release is built from a commit that passed the same checks a pull request
  # does rather than from a second, shorter list that drifts from this one.
  workflow_call:

# The compiler every claim in this repository is measured against.
# `docs/divergences.md` opens with it and `tests/gnucobol-validation.test.ts`
# records it as the one that produced the evidence, so CI builds exactly this
# rather than taking whatever `apt` offers.
env:
  GNUCOBOL_VERSION: "3.2"

# Read-only by default. `security-events: write` is what the SARIF upload needs
# and `actions: read` is what its telemetry reads — without the second it still
# uploads, then logs "Resource not accessible by integration" as an annotation
# on an otherwise clean run, which is noise indistinguishable from a fault.
permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Before `setup-node`, because its `cache: "pnpm"` needs pnpm on PATH —
      # and through the action rather than `npm install -g`, which would run
      # under whatever Node the runner image happens to ship rather than the
      # version this repository pins. The version comes from `packageManager`
      # in package.json, so there is one place to change it.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      # tests/cobol-compiles.test.ts and tests/conformance.test.ts skip without
      # cobc. Installing GnuCOBOL keeps both lanes running in CI, so neither
      # generated COBOL that no compiler accepts nor a program that compiles and
      # then computes the wrong balance can merge.
      #
      # **Built, not installed from apt.** `apt-get install gnucobol` on
      # ubuntu-latest gives 3.1.2, and every version this project documents,
      # measures and asserts is 3.2.0 — `docs/divergences.md` opens with it and
      # `tests/gnucobol-validation.test.ts` records it as the compiler that
      # produced the evidence. The gap is not cosmetic: 3.2 added the
      # `JSON-STATUS` special register that Enterprise COBOL has and that this
      # compiler emits, so on 3.1.2 six test files fail on COBOL that is correct
      # for the target. CI was validating against a compiler nobody claimed.
      #
      # Cached on the version, so it is built once and restored after that.
      - name: Cache GnuCOBOL ${{ env.GNUCOBOL_VERSION }}
        id: gnucobol
        uses: actions/cache@v6
        with:
          path: /opt/gnucobol
          key: gnucobol-${{ env.GNUCOBOL_VERSION }}-${{ runner.os }}

      # Built in the runner's temp directory, not the workspace. The first
      # attempt unpacked the tarball where it stood, and `prettier --check .`
      # then reported style issues in GnuCOBOL's own README.
      - name: Build GnuCOBOL ${{ env.GNUCOBOL_VERSION }}
        if: steps.gnucobol.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update
          # libcjson-dev is what gives `JSON GENERATE` and `JSON PARSE` a
          # backend; without it cobc builds and then refuses both at run time.
          sudo apt-get install -y --no-install-recommends \
            build-essential libgmp-dev libdb-dev libncurses-dev \
            libxml2-dev libcjson-dev
          curl -fsSL -o gnucobol.tar.xz \
            "https://downloads.sourceforge.net/project/gnucobol/gnucobol/3.2/gnucobol-${GNUCOBOL_VERSION}.tar.xz"
          tar xf gnucobol.tar.xz
          cd "gnucobol-${GNUCOBOL_VERSION}"
          ./configure --prefix=/opt/gnucobol
          make -j"$(nproc)"
          sudo make install

      - name: Put GnuCOBOL on the path, and prove which one it is
        run: |
          echo "/opt/gnucobol/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/opt/gnucobol/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "COB_CONFIG_DIR=/opt/gnucobol/share/gnucobol/config" >> "$GITHUB_ENV"
          echo "COB_COPY_DIR=/opt/gnucobol/share/gnucobol/copy" >> "$GITHUB_ENV"
          # The assertion, not a courtesy print: a cache restored from a
          # different build, or an apt cobc earlier on the path, fails here
          # rather than eight test files later.
          #
          # `cobc --version` prints `cobc (GnuCOBOL) 3.2.0`. The closing
          # parenthesis sits between the name and the number, so a pattern of
          # `GnuCOBOL <version>` never matches — which is what failed twice,
          # first through `grep -q` and then through `case`, against a compiler
          # printing exactly the right string. Matched on `(GnuCOBOL) ` now, and
          # the failure prints what it saw so the next one is one read.
          version="$(/opt/gnucobol/bin/cobc --version 2>&1 | head -1)"
          echo "$version"
          case "$version" in
            *"(GnuCOBOL) ${GNUCOBOL_VERSION}"*) ;;
            *)
              echo "::error::cobc is not GnuCOBOL ${GNUCOBOL_VERSION}: ${version}"
              exit 1
              ;;
          esac

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Check example formatting
        run: pnpm fmt:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck VS Code extension
        run: npx tsc -p packages/vscode-extension/tsconfig.json

      - name: Test
        run: pnpm test

      # `tools/verify-examples.ts` rather than a loop over `examples/*/`, which
      # is what this was and which assumed every example is one program.
      # `end-of-day-settlement` is a job of four, so the loop ran `bankc test`
      # on a directory with no `src/main.bank.ts` and stopped the build.
      - name: Verify every example
        run: pnpm examples:verify

      # Banking safety diagnostics as SARIF, so they appear as inline
      # annotations on a pull request rather than only in this log.
      - name: Produce SARIF report
        if: always()
        run: pnpm bankc check examples/account-posting --format sarif --output bankc.sarif

      # Requires a public repository or GitHub Advanced Security, so this does
      # not fail the build while the repository is private.
      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bankc.sarif
          category: banklang

      # A3, the deployment gate. The whole site is built here, after every
      # check above has passed, and Cloudflare Pages builds from the same
      # command. A red build cannot produce a page: the steps above fail the
      # job before this one runs.
      #
      # Building the site also builds the playground, which bundles the
      # compiler for the browser — so this still catches anything that
      # accidentally introduces a Node-only dependency into the compiler core.
      - name: Build the site
        run: pnpm build:site

      - name: Upload the site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/site
          retention-days: 14

      # R4. Packaging reads the archive back and fails if the bundle, the
      # server or the icon is missing from it, or if the source tree got in —
      # every one of which packages successfully and prints DONE.
      - name: Package the VS Code extension
        run: pnpm build:vsix

      - name: Upload the extension
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: dist/vsix
          retention-days: 90

  # R2. The inventory a bank's security function asks for before anything else.
  #
  # A job of its own, in parallel, for two reasons. It resolves the prebuilt
  # binaries for every platform — about a gigabyte, and the only way the BOM
  # names a licence for all of them; see the measurement in `tools/sbom.ts`.
  # And it deliberately does not use `cache: "pnpm"`, because that store would
  # then carry every platform's binaries into every other job's cache.
  #
  # It runs on every push rather than only on a tag. The alternative is that the
  # multi-platform resolve is first exercised on the day of a release, which is
  # the day it must not fail.
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Before `setup-node`, because its `cache: "pnpm"` needs pnpm on PATH —
      # and through the action rather than `npm install -g`, which would run
      # under whatever Node the runner image happens to ship rather than the
      # version this repository pins. The version comes from `packageManager`
      # in package.json, so there is one place to change it.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `--all-platforms` in `tools/sbom.ts`. Fails on any component with no
      # licence, so a dependency that ships a binary for a platform the tool
      # does not resolve stops the build rather than quietly costing the reader
      # a licence.
      - name: Build the bill of materials
        run: pnpm sbom:release

      - name: Upload the bill of materials
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: dist/sbom
          retention-days: 90
