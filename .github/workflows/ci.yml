name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm@11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      # tests/cobol-compiles.test.ts and tests/conformance.test.ts skip without
      # cobc. Installing GnuCOBOL keeps both lanes running in CI, so neither
      # generated COBOL that no compiler accepts nor a program that compiles and
      # then computes the wrong balance can merge.
      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnucobol
          cobc --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm fmt:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck VS Code extension
        run: npx tsc -p packages/vscode-extension/tsconfig.json

      - name: Test
        run: pnpm test

      - name: Verify every example
        run: |
          for example in examples/*/; do
            echo "::group::bankc test $example"
            pnpm bankc test "$example"
            echo "::endgroup::"
          done

      # Banking safety diagnostics as SARIF, so they appear as inline
      # annotations on a pull request rather than only in this log.
      - name: Produce SARIF report
        if: always()
        run: pnpm bankc check examples/account-posting --format sarif --output bankc.sarif

      # Requires a public repository or GitHub Advanced Security, so this does
      # not fail the build while the repository is private.
      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bankc.sarif
          category: banklang

      # The playground bundles the compiler for the browser. Building it here
      # catches anything that accidentally introduces a Node-only dependency
      # into the compiler core.
      - name: Build playground
        run: pnpm playground:build

      - name: Upload playground bundle
        uses: actions/upload-artifact@v4
        with:
          name: playground
          path: packages/playground/dist
          retention-days: 14
