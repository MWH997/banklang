name: scheduled

# The checks that are too slow for a pull request and too valuable to run by
# hand. Mutation testing takes about an hour; the citation check needs the
# network and depends on IBM not retiring a topic, and the advisory check
# depends on what was published this week — none of which is something a commit
# can cause, or should be blamed for. What they share is that their answer can
# change while the code does not, which is exactly what a per-push check cannot
# see.
on:
  schedule:
    # Mondays, 04:00 UTC.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  GNUCOBOL_VERSION: "3.2"

jobs:
  mutation:
    name: mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      # Every lane reports, rather than the first failure hiding the rest.
      fail-fast: false
      matrix:
        include:
          - lane: rules
            script: test:mutation
            report: dist/mutation
          - lane: emitter
            script: test:mutation:emitter
            report: dist/mutation-emitter
          - lane: conformance-lint
            script: test:mutation:lint
            report: dist/mutation-lint
          # Added 2026-08-08. The emitter, the interpreter and the checkers had
          # no lane at all: 9,263 lines deciding what COBOL a program becomes,
          # 6,044 deciding what running it does, and the z/OS linter, which
          # exists to catch what every other check is blind to.
          - lane: backend
            script: test:mutation:backend
            report: dist/mutation-backend
          - lane: runtime-core
            script: test:mutation:runtime
            report: dist/mutation-runtime
          - lane: runtime-machine
            script: test:mutation:runtime:machine
            report: dist/mutation-runtime-machine
          - lane: runtime-statements
            script: test:mutation:runtime:statements
            report: dist/mutation-runtime-statements
          - lane: runtime-precompiler
            script: test:mutation:precompiler
            report: dist/mutation-precompiler
          - lane: tools
            script: test:mutation:tools
            report: dist/mutation-tools
          # Added 2026-08-09. `BANK-FILE-017` is a published guarantee about
          # what the compiler proves, and it lives in one file that the rules
          # lane's aggregate hid at 63.73% behind two files above 80.
          - lane: safety
            script: test:mutation:safety
            report: dist/mutation-safety
    steps:
      - uses: actions/checkout@v7

      # Before `setup-node`, because its `cache: "pnpm"` needs pnpm on PATH —
      # and through the action rather than `npm install -g`, which would run
      # under whatever Node the runner image happens to ship rather than the
      # version this repository pins. The version comes from `packageManager`
      # in package.json, so there is one place to change it.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Stryker exits non-zero when the score falls under the `break` threshold
      # in its config, so the step failing is the signal. `continue-on-error`
      # keeps the report upload and the issue below reachable either way.
      - name: Run ${{ matrix.lane }}
        id: run
        continue-on-error: true
        # Leave the job fifteen minutes to require/upload the report, open an
        # accurate issue, and restore the failure if Stryker itself stalls.
        timeout-minutes: 165
        run: pnpm ${{ matrix.script }}

      # A command failure and an absent report are different evidence. Check
      # the file explicitly so the floor step never turns "Stryker produced
      # nothing" into the much narrower claim "a file scored too low".
      - name: Require the mutation report
        id: report
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          report="${{ matrix.report }}/mutation.json"
          if test -f "$report"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::error::The ${{ matrix.lane }} lane produced no JSON report at $report"
            exit 1
          fi

      # Stryker's `break` threshold is applied to the aggregate, and an
      # aggregate hides the file worth knowing about: the emitter lane scored
      # 61.65 against a break of 60 and went green while
      # `packages/cobol-ir/src/index.ts` inside it was at 44.12, with 81
      # surviving mutants. Two healthier files carried it.
      #
      # Run after a non-zero Stryker exit only when its report exists. Stryker
      # can return non-zero because the aggregate is under its threshold and
      # still leave valid evidence for the per-file check.
      - name: Hold every file to the mutation floor
        id: floor
        if: always() && steps.report.outputs.present == 'true'
        continue-on-error: true
        run: pnpm tsx tools/mutation-floor.ts ${{ matrix.report }}/mutation.json

      - name: Upload the HTML report
        if: always() && steps.report.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mutation-${{ matrix.lane }}
          path: ${{ matrix.report }}
          retention-days: 90

      # A silent drop is the failure mode worth preventing: these runs exist to
      # be read, and nobody reads a workflow that goes green whatever happens.
      - name: Open an issue when mutation validation fails
        if: always() && (steps.run.outcome == 'failure' || steps.report.outcome == 'failure' || steps.floor.outcome == 'failure')
        uses: actions/github-script@v9
        env:
          MUTATION_LANE: ${{ matrix.lane }}
          RUN_OUTCOME: ${{ steps.run.outcome }}
          REPORT_PRESENT: ${{ steps.report.outputs.present }}
          FLOOR_OUTCOME: ${{ steps.floor.outcome }}
        with:
          script: |
            const lane = process.env.MUTATION_LANE;
            const title = `Mutation validation failed: ${lane}`;
            const legacyTitle = `Mutation score below threshold: ${lane}`;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "mutation",
            });
            const open = existing.data.find(
              (issue) => issue.title === title || issue.title === legacyTitle,
            );
            const failures = [];
            if (process.env.RUN_OUTCOME === "failure") {
              failures.push(
                "- **Run failure:** the Stryker command returned non-zero. Inspect its log to distinguish an aggregate-threshold result from a runner or configuration error.",
              );
            }
            if (process.env.REPORT_PRESENT !== "true") {
              failures.push(
                "- **Missing report:** the lane produced no mutation JSON, so the per-file floor could not run and no report artifact was uploaded.",
              );
            }
            if (process.env.FLOOR_OUTCOME === "failure") {
              failures.push(
                "- **Per-file floor failure:** the floor command returned non-zero after finding the JSON report. Its log identifies a low-scoring file or an unreadable report.",
              );
            }
            const body = [
              `The \`${lane}\` mutation lane failed validation:`,
              "",
              ...failures,
              "",
              `Run: ${url}`,
              "",
              process.env.REPORT_PRESENT === "true"
                ? "The HTML and JSON reports are attached to that run as an artifact. Read the survivors before adjusting a threshold."
                : "Use the run log to repair report generation before drawing a conclusion about mutation score.",
            ].join("\n");
            if (open) {
              if (open.title !== title) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: open.number,
                  title,
                });
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["mutation"],
              });
            }

      # The earlier steps continue only so evidence can be uploaded and the
      # issue can be written. Restore their failure as the job's conclusion.
      - name: Fail an unsuccessful mutation lane
        if: always() && (steps.run.outcome == 'failure' || steps.report.outcome == 'failure' || steps.floor.outcome == 'failure')
        run: exit 1

  # Horizontal validation: this compiler against COBOL nobody wrote for it.
  #
  # Here rather than in `ci.yml` because it downloads about 500MB from three
  # hosts and none of it can be caused by a pull request. The framework itself
  # *is* checked on every push — `tests/horizontal-validation.test.ts` and
  # `tests/horizontal-defects.test.ts` run in the ordinary suite from
  # checked-in fixtures and read no corpus — so what runs here is the part that
  # needs the corpora.
  #
  # `workflow_dispatch` and the weekly schedule only. The corpora are pinned by
  # `validation/corpus-lock.json`, so a run that disagrees with the lock fails
  # rather than quietly reporting a different score.
  horizontal:
    name: horizontal validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Set up pinned GnuCOBOL
        uses: ./.github/actions/setup-gnucobol
        with:
          version: ${{ env.GNUCOBOL_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Keyed on the lock, so a re-pin fetches afresh and an unchanged lock
      # restores the same bytes that produced the last published numbers.
      - name: Cache the external corpora
        uses: actions/cache@v6
        with:
          path: validation/cache
          key: horizontal-corpora-${{ hashFiles('validation/corpus-lock.json') }}

      # Without `--update`, the lock is authority: anything that does not match
      # what was pinned fails here rather than becoming a new measurement.
      - name: Fetch the corpora
        run: pnpm horizontal:fetch

      - name: Split specifications from reference solutions
        run: pnpm horizontal:materialise

      - name: Read the real-world corpora
        run: pnpm horizontal:analyse

      - name: Run the semantic corpora
        run: pnpm horizontal:run

      # No copy is supplied and none is downloaded, so this reports unavailable
      # and records which emitted constructs nothing local covers.
      - name: Report COBOL-85 conformance coverage
        run: pnpm horizontal:ccvs85

      - name: Regenerate the published pages
        run: pnpm horizontal:report

      # The published pages are generated from the evidence, so a diff here
      # means the numbers in git no longer match what the corpora produce.
      #
      # `environment.json` is excluded, and has to be: it records the commit the
      # measurement ran on, which differs from the commit the evidence was
      # committed in by construction. Comparing it would report every run as
      # stale, and a check that always fails is a check nobody reads.
      - name: Fail if the committed results are stale
        run: |
          git diff --exit-code -- \
            docs/validation \
            evidence/horizontal \
            ':!evidence/horizontal/*/environment.json'

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: horizontal-evidence
          path: evidence/horizontal
          retention-days: 90

  advisories:
    name: advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Before `setup-node`, because its `cache: "pnpm"` needs pnpm on PATH —
      # and through the action rather than `npm install -g`, which would run
      # under whatever Node the runner image happens to ship rather than the
      # version this repository pins. The version comes from `packageManager`
      # in package.json, so there is one place to change it.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Here rather than in `ci.yml` for the same reason as the citations job: a
      # new advisory is published against code that has not changed, so it is
      # not something a pull request caused and not something a pull request
      # should be blocked by. It is, however, the first thing anyone evaluating
      # this repository will run, and `pnpm-workspace.yaml` pins two transitive
      # packages to keep the answer clean — a pin that goes stale silently is
      # worse than no pin.
      - name: Check for published advisories
        id: check
        continue-on-error: true
        run: pnpm audit --audit-level low | tee audit.log

      - name: Open an issue when an advisory affects a dependency
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("node:fs");
            const log = fs.readFileSync("audit.log", "utf8");
            const title = "A dependency has a published advisory";
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "`pnpm audit` reported at least one advisory against the locked dependency tree.",
              "",
              "```",
              log.slice(0, 50000),
              "```",
              "",
              `Run: ${url}`,
              "",
              "Every dependency here is a build or test tool — none is shipped in generated COBOL. That is a reason to judge severity, not a reason to leave it: check whether the patched version is past the `minimumReleaseAge` window and raise the pin in `pnpm-workspace.yaml`, rather than adding an exemption for the package the policy just stopped.",
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "dependencies",
            });
            const open = existing.data.find((issue) => issue.title === title);
            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["dependencies"],
              });
            }

  citations:
    name: citations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Before `setup-node`, because its `cache: "pnpm"` needs pnpm on PATH —
      # and through the action rather than `npm install -g`, which would run
      # under whatever Node the runner image happens to ship rather than the
      # version this repository pins. The version comes from `packageManager`
      # in package.json, so there is one place to change it.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `docs/citations.json` records what each cited page resolved to on the
      # day it was checked. It cannot notice IBM retiring a topic on its own,
      # and a pull request must not fail because somebody else's site changed.
      - name: Check every cited source
        id: check
        continue-on-error: true
        run: pnpm docs:citations | tee citations.log

      - name: Open an issue when a citation stops resolving
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("node:fs");
            const log = fs.readFileSync("citations.log", "utf8");
            const title = "A cited source no longer resolves";
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "`pnpm docs:citations` found a citation that is broken or has moved.",
              "",
              "```",
              log.slice(0, 50000),
              "```",
              "",
              `Run: ${url}`,
              "",
              "A `BROKEN` line means the page is gone or resolved to a product shell. A `MOVED` line means the page is still there under a different heading, which may or may not still support the claim it was cited for — read it before running `pnpm docs:citations --write`.",
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "citations",
            });
            const open = existing.data.find((issue) => issue.title === title);
            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["citations"],
              });
            }
