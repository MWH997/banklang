packages:
  - "packages/*"
# An install script is arbitrary code running on a developer's machine before
# anybody has read a line of what was downloaded, so each one is a decision
# rather than a default.
#
# `esbuild` is here because it bundles the extension and the playground, and its
# script fetches the platform binary that does the work.
#
# `@vscode/vsce` brings the other two, and neither is needed for what this
# repository does with it. `keytar` builds a native binding to the operating
# system's keychain, to hold a marketplace token; it is deprecated upstream, and
# publishing happens in CI from `VSCE_PAT` in the environment. `@vscode/vsce-sign`
# unpacks a signing binary used when publishing, which is a step this repository
# does not perform, and `vsce package` does not touch it. If publishing ever moves
# to a workstation, turn the signer on there and read what it fetches first.
allowBuilds:
  esbuild: true
  keytar: false
  "@vscode/vsce-sign": false

# A compromised npm release is normally found and pulled within days, so the
# safe move is not to be among the first to install one. `minimumReleaseAge` is
# how long a version must have existed before pnpm will resolve it.
#
# **Written out rather than left to the default.** pnpm 11 turns this on at 1440
# minutes on its own, and until 2026-08-07 that default was the whole of the
# protection here: three files described a policy this workspace held, and this
# one held a comment about it. A default is a control somebody else can change:
# a pnpm release that lowers it, or a contributor on pnpm 10 where the setting
# did not exist, silently gets none of this, and nothing in the repository would
# say so. 1440 is what was already in force, so writing it changes no
# resolution; what it changes is that a future pnpm cannot remove it quietly.
#
# Raising it to 10080 (seven days) matches the sentence above more honestly and
# is a decision with a cost on the other side: a *patched* release is held back
# by the same window, and Dependabot's pull requests would fail `pnpm install`
# until the version it proposes has aged. That trade is open.
minimumReleaseAge: 1440

# Held one patch back from the newest vite, which vitest depends on and would
# otherwise pull in the day it is published.
#
# When a fresh version arrives as a transitive dependency, pnpm offers to add it
# to `minimumReleaseAgeExclude`, an exemption for the one package the policy
# just stopped, which is the opposite of what the policy is for. Naming a
# version that is already past the cutoff keeps the check meaning something.
#
# 8.1.5 is well clear of every advisory that prompted this upgrade: those affect
# vite up to 6.4.2. Raise this whenever the newest release has aged past the
# window, rather than excluding it.
overrides:
  vite: 8.1.5
  # Stryker reaches qs through typed-rest-client, four levels down, and pins a
  # line with a `stringify` DoS (GHSA-q8mj-m7cp-5q26). Nothing here calls it,
  # since the mutation runners talk to no HTTP service, but "unreachable" is an
  # argument that has to be re-made every time somebody scans this repository,
  # and the patched release is a patch bump on the same line.
  qs: ^6.15.3
